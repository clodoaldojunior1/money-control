<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f5f5b">
  <title>Sem conexão · Nico</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: #f4f6f7; color: #151b21; font-family: system-ui, sans-serif; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 20px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { margin: 0 0 24px; color: #4e5760; font-size: 15px; line-height: 1.5; max-width: 300px; }
    button { background: #1f5f5b; color: #fff; border: 0; border-radius: 12px; padding: 12px 24px; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>Sem conexão</h1>
    <p>O Nico precisa de internet para mostrar seus dados. Confira a conexão e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
